<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="GRAVV CRM">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow">
<title>GRAVV · CRM</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/styles.css?v=4">
<script src="/js/core.js?v=4" defer></script>
<script src="/js/comercial.js?v=4" defer></script>
<script src="/js/clientes.js?v=4" defer></script>
<script src="/js/financeiro.js?v=4" defer></script>
<script src="/js/gestao.js?v=4" defer></script>
</head>
<body>
<a class="skip" href="#content">Ir para o conteúdo</a>
<div id="shell" hidden>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/"><img src="/logo.png" alt="GRAVV" width="120" height="42"></a>
    <nav id="nav" aria-label="Navegação principal"></nav>
    <div class="side-foot">
      <a href="#/configuracoes" data-nav="configuracoes" class="nav-link"><span class="ico" data-ico="gear"></span>Configurações</a>
      <button type="button" class="nav-link" data-action="logout"><span class="ico" data-ico="out"></span>Sair</button>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <button id="menu-toggle" class="icon-btn" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button>
      <h1 id="page-title">Dashboard</h1>
      <div class="top-search"><input id="global-search" type="search" placeholder="Buscar cliente, lead, projeto…" aria-label="Busca global" autocomplete="off"><div id="search-results" class="dropdown" hidden></div></div>
      <div class="top-actions">
        <button type="button" class="icon-btn bell" id="bell" aria-label="Notificações"><span class="ico" data-ico="bell"></span><span id="bell-count" class="dot-count" hidden></span></button>
        <div id="bell-menu" class="dropdown right" hidden></div>
        <button type="button" class="primary" id="new-btn">+ Novo</button>
        <div id="new-menu" class="dropdown right" hidden></div>
      </div>
    </header>
    <main id="content" tabindex="-1"></main>
  </div>
  <div id="side-backdrop" class="side-backdrop" hidden></div>
  <nav id="tabbar" class="tabbar" aria-label="Atalhos">
    <a href="#/" data-tab="inicio"><span class="ico" data-ico="home"></span>Início</a>
    <a href="#/prospeccao" data-tab="funil"><span class="ico" data-ico="funnel"></span>Funil</a>
    <a href="#/financeiro" data-tab="financeiro"><span class="ico" data-ico="chart"></span>Financeiro</a>
    <a href="#/pessoal" data-tab="pessoal"><span class="ico" data-ico="wallet"></span>Pessoal</a>
    <button type="button" id="tab-menu" data-tab="menu"><span class="ico" data-ico="menu"></span>Menu</button>
  </nav>
</div>
<section id="gate" class="gate">
  <div class="gate-mark">GRAVV</div>
  <h2 id="gate-title">Abrindo o CRM…</h2>
  <p id="gate-message" class="muted"></p>
  <form id="login-form" class="login-form" hidden>
    <label class="field">E-mail<input id="login-email" type="email" autocomplete="username" required></label>
    <label class="field">Senha<input id="login-password" type="password" autocomplete="current-password" required></label>
    <p id="login-error" class="form-error" role="alert"></p>
    <button id="login-button" class="primary" type="submit">Entrar</button>
  </form>
  <button id="retry" class="primary" type="button" hidden>Tentar de novo</button>
</section>
<div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
<aside id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <form id="sheet-form" novalidate>
    <header class="sheet-head"><h2 id="sheet-title"></h2><button type="button" class="icon-btn" data-close aria-label="Fechar">✕</button></header>
    <div id="sheet-body" class="sheet-body"></div>
    <p id="sheet-error" class="form-error" role="alert"></p>
    <footer class="sheet-foot" id="sheet-foot"></footer>
  </form>
</aside>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
